<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- nori sheet: green-black with a faint olive sheen -->
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243823"/>
      <stop offset="0.55" stop-color="#152216"/>
      <stop offset="1" stop-color="#0b120c"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#9dbb6a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9dbb6a" stop-opacity="0"/>
    </radialGradient>
    <!-- pressed seaweed fibres: fine noise, thresholded into light flecks -->
    <filter id="fibres" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.11" numOctaves="4" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.72  0 0 0 0 0.38  0 0 0 1.6 -0.78"/>
    </filter>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#e9e2d2"/>
    </linearGradient>
    <linearGradient id="salmon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a6b"/>
      <stop offset="1" stop-color="#f26b4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#sheet)"/>
    <rect width="1024" height="1024" filter="url(#fibres)" opacity="0.6"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- the strip: neighbours cut by the edges, the focused column centered -->
    <g filter="url(#shadow)">
      <rect x="18" y="300" width="230" height="424" rx="34" fill="#8f9580"/>
      <rect x="776" y="300" width="230" height="424" rx="34" fill="#8f9580"/>
      <rect x="292" y="256" width="440" height="512" rx="44" fill="url(#rice)"/>
    </g>
    <!-- salmon title bar on the focused window -->
    <path d="M336 256h352a44 44 0 0 1 44 44v34H292v-34a44 44 0 0 1 44-44z" fill="url(#salmon)"/>
  </g>

  <!-- thin rim so the sheet reads on dark backgrounds -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#c9dca0" stroke-opacity="0.18" stroke-width="2"/>
</svg>
